<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CLUB STELLA">
<meta name="mobile-web-app-capable" content="yes">
<title>CLUB STELLA 〜ステラ〜 管理システム</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#141019;--bg2:#1b1422;--card:#221a2c;--card2:#2b2136;
  --gold:#caa14b;--gold2:#e6c778;--wine:#7a2e42;
  --ink:#f5efe f;--ink:#f4eef4;--ink2:#c9bdc9;--ink3:#8d8296;
  --green:#3fae6a;--green2:#173627;
  --amber:#e0a83f;--amber2:#3a2e12;
  --red:#e2544f;--red2:#3a1a1a;
  --blue:#5088d6;--blue2:#182a3f;
  --bd:#372a44;--bd2:#463758;
  --r:16px;--r2:11px;--sh:0 6px 20px rgba(0,0,0,.4);
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:inherit;background:var(--card2);border:1px solid var(--bd2);border-radius:8px;padding:9px 10px;font-size:15px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:-1px}
label{display:block;font-size:12.5px;color:var(--ink3);margin:10px 0 4px;font-weight:500}
label:first-child{margin-top:0}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.mono{font-family:'DM Mono',monospace}

#hdr{position:sticky;top:0;z-index:100;padding:calc(10px + var(--safe-t)) 16px 10px;background:linear-gradient(180deg,var(--bg2),rgba(27,20,34,.96));border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:10px}
#hdr .logo{font-weight:900;font-size:17px;letter-spacing:.5px;color:var(--gold2);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hdr .logo small{color:var(--ink3);font-weight:500;font-size:11px;display:block}
#hdr .clock{font-family:'DM Mono',monospace;color:var(--ink2);font-size:13px;text-align:right}
#alertbar{background:var(--red2);border-bottom:1px solid #5a2323;padding:8px 14px;display:none;gap:8px;overflow-x:auto;white-space:nowrap}
#alertbar.show{display:flex}
#alertbar .chip{display:inline-flex;align-items:center;gap:6px;background:rgba(226,84,79,.18);border:1px solid #6a3030;color:#ffb3b0;padding:5px 10px;border-radius:20px;font-size:12.5px;font-weight:600;flex:none}
#alertbar .chip.warn{background:rgba(224,168,63,.15);border-color:#6a5528;color:#ffd68a}

#app{padding:14px 14px calc(90px + var(--safe-b));max-width:820px;margin:0 auto;min-height:70vh}
.hide{display:none!important}

/* Tabs */
h2.viewtitle{font-size:17px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h2.viewtitle .sub{font-size:12px;color:var(--ink3);font-weight:500}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--bg2);border-top:1px solid var(--bd);display:flex;padding:6px 4px calc(6px + var(--safe-b));max-width:820px;margin:0 auto}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--ink3);font-size:10.5px;font-weight:600}
#nav button .ic{font-size:19px;line-height:1}
#nav button.active{color:var(--gold2);background:rgba(202,161,75,.1)}

/* Cards / grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.tablecard{background:var(--card);border:1.5px solid var(--bd);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:112px;position:relative;overflow:hidden;transition:.15s}
.tablecard.empty{border-style:dashed;opacity:.85}
.tablecard.active{border-color:#3a5a8a;background:linear-gradient(160deg,var(--card),var(--blue2))}
.tablecard.warn{border-color:var(--amber);background:linear-gradient(160deg,var(--card),var(--amber2));animation:pulseAmber 2s infinite}
.tablecard.over{border-color:var(--red);background:linear-gradient(160deg,var(--card),var(--red2));animation:pulseRed 1.1s infinite}
@keyframes pulseAmber{0%,100%{box-shadow:0 0 0 0 rgba(224,168,63,.35)}50%{box-shadow:0 0 0 6px rgba(224,168,63,0)}}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(226,84,79,.45)}50%{box-shadow:0 0 0 8px rgba(226,84,79,0)}}
.tablecard .tname{font-weight:800;font-size:16px}
.tablecard .tstatus{font-size:11.5px;color:var(--ink3);font-weight:600}
.tablecard .ttime{font-family:'DM Mono',monospace;font-size:20px;font-weight:600;margin-top:auto}
.tablecard .tmeta{font-size:11.5px;color:var(--ink2)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700}
.badge.g{background:var(--green2);color:#7fe0a8}
.badge.a{background:var(--amber2);color:var(--amber)}
.badge.r{background:var(--red2);color:#ff9a97}
.badge.gold{background:rgba(202,161,75,.15);color:var(--gold2)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:11px;font-weight:700;font-size:14px;background:var(--card2);border:1px solid var(--bd2);color:var(--ink)}
.btn.primary{background:linear-gradient(160deg,var(--gold2),var(--gold));color:#2a1e08;border:none}
.btn.wine{background:var(--wine);color:#ffd9df;border:none}
.btn.ghost{background:transparent;border:1px solid var(--bd2)}
.btn.sm{padding:7px 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn.danger{background:var(--red2);color:#ff9a97;border:1px solid #5a2a2a}
.btn:disabled{opacity:.4}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fab{position:fixed;right:calc(16px + (100vw - 820px)/2);bottom:calc(84px + var(--safe-b));z-index:90}
@media (max-width:820px){.fab{right:16px}}

/* Lists */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r2);padding:11px 13px}
.row .rmain{flex:1;min-width:0}
.row .rtitle{font-weight:700;font-size:14.5px}
.row .rsub{font-size:12px;color:var(--ink3);margin-top:2px}
.row .ramt{font-family:'DM Mono',monospace;font-weight:600;font-size:15px;white-space:nowrap}
.row .ractions{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rankrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r2);padding:11px 13px}
.rankrow .rk{font-family:'DM Mono',monospace;font-weight:700;color:var(--gold2);width:22px;text-align:center;flex:none}
.section{margin-bottom:22px}
.sectitle{font-size:13px;font-weight:700;color:var(--gold2);margin-bottom:8px;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:center}
.empty-hint{color:var(--ink3);font-size:13px;text-align:center;padding:22px 10px;border:1px dashed var(--bd2);border-radius:var(--r2)}

/* Session screen */
.timerbig{font-family:'DM Mono',monospace;font-size:40px;font-weight:700;text-align:center}
.timerwrap{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:14px}
.timerwrap .lbl{color:var(--ink3);font-size:12px;font-weight:600;margin-bottom:4px}
.totalbar{position:sticky;bottom:calc(72px + var(--safe-b));background:var(--card2);border:1px solid var(--gold);border-radius:var(--r);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-top:14px;box-shadow:var(--sh)}
.totalbar .amt{font-family:'DM Mono',monospace;font-size:22px;font-weight:800;color:var(--gold2)}
.backtop{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.backtop .ic{font-size:20px}

/* Modal */
#overlay{position:fixed;inset:0;background:rgba(10,7,13,.72);z-index:300;display:none;align-items:flex-end;justify-content:center}
#overlay.show{display:flex}
#modal{background:var(--bg2);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(22px + var(--safe-b));border:1px solid var(--bd);animation:slideUp .18s ease-out}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
#modal h3{font-size:16.5px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
#modal h3 .x{color:var(--ink3);font-size:22px;line-height:1;padding:4px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chipsel{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chipsel .chip{padding:8px 13px;border-radius:20px;border:1.5px solid var(--bd2);font-size:13px;font-weight:600;color:var(--ink2)}
.chipsel .chip.on{background:var(--gold);border-color:var(--gold);color:#2a1e08}
.toast{position:fixed;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold);color:var(--ink);padding:10px 18px;border-radius:30px;font-size:13.5px;font-weight:600;z-index:400;box-shadow:var(--sh);opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(6px)}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left}
table.tbl th{color:var(--ink3);font-weight:600;font-size:11.5px}
.small{font-size:12px;color:var(--ink3)}
.right{text-align:right}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r2);padding:12px}
.stat .v{font-family:'DM Mono',monospace;font-size:19px;font-weight:700;color:var(--gold2)}
.stat .k{font-size:11.5px;color:var(--ink3);margin-top:2px}
.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
@media(min-width:560px){.statgrid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div id="hdr">
  <div class="logo" id="storeNameHdr">CLUB STELLA<small id="storeSubHdr">〜ステラ〜</small></div>
  <div class="clock" id="clockDisp">--:--:--</div>
</div>
<div id="alertbar"></div>
<div id="app"></div>
<div id="nav"></div>
<div id="overlay"><div id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const STORAGE_KEY = 'clubStellaPosData_v1';
const uid = (p)=> p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const yen = (n)=> '¥'+Math.round(n||0).toLocaleString('ja-JP');
const pad2 = (n)=> String(n).padStart(2,'0');

function defaultState(){
  return {
    settings:{
      storeName:'CLUB STELLA',
      storeSub:'〜ステラ〜',
      defaultNominationFee:3000
    },
    tables:[
      {id:uid('tb'),name:'A-1',capacity:6},
      {id:uid('tb'),name:'A-2',capacity:6},
      {id:uid('tb'),name:'B-1',capacity:4},
      {id:uid('tb'),name:'B-2',capacity:4},
      {id:uid('tb'),name:'VIP',capacity:10}
    ],
    setPlans:[
      {id:uid('pl'),name:'スタンダード60分',durationMin:60,extensionMin:30,extensionPrice:5000,
        rows:[
          {minGuests:1,maxGuests:2,minCast:1,maxCast:1,price:8000},
          {minGuests:1,maxGuests:2,minCast:2,maxCast:2,price:12000},
          {minGuests:3,maxGuests:5,minCast:2,maxCast:3,price:18000},
          {minGuests:6,maxGuests:99,minCast:3,maxCast:6,price:28000}
        ]}
    ],
    products:[
      {id:uid('pr'),name:'シャンパン(レギュラー)',price:28000,category:'bottle',backEligible:true},
      {id:uid('pr'),name:'ボトル(ウイスキー)',price:15000,category:'bottle',backEligible:true},
      {id:uid('pr'),name:'キャストドリンク',price:1500,category:'drink',backEligible:true},
      {id:uid('pr'),name:'お通し',price:1000,category:'other',backEligible:false}
    ],
    nominationRanks:[
      {id:uid('rk'),name:'新人',fee:2000},
      {id:uid('rk'),name:'レギュラー',fee:3000},
      {id:uid('rk'),name:'No.1',fee:6000}
    ],
    staff:[],
    shifts:[],
    sessions:[],
    payouts:[],
    expenses:[]
  };
}

let state = defaultState();
let ui = { tab:'floor', sessionId:null, editing:{} };

/* ---------- Storage (IndexedDB, with one-time migration from old localStorage data) ---------- */
const IDB_NAME = 'clubStellaDB';
const IDB_STORE = 'kv';
const IDB_KEY = 'appState';
let _dbPromise = null;
function openIdb(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB unsupported')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _dbPromise;
}
function idbGet(key){
  return openIdb().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(key);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  }));
}
function idbSet(key, value){
  return openIdb().then(db=> new Promise((resolve, reject)=>{
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  }));
}
function normalizeLoadedState(parsed){
  const d = defaultState();
  parsed.settings = Object.assign({}, d.settings, parsed.settings||{});
  parsed.payouts = parsed.payouts || [];
  parsed.expenses = parsed.expenses || [];
  return parsed;
}
async function loadInitial(){
  try{
    const fromIdb = await idbGet(IDB_KEY);
    if(fromIdb) return normalizeLoadedState(fromIdb);
  }catch(e){ console.error('IndexedDB load failed', e); }
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const migrated = normalizeLoadedState(JSON.parse(raw));
      await idbSet(IDB_KEY, migrated).catch(e=>console.error('migration save failed', e));
      return migrated;
    }
  }catch(e){ console.error('legacy load failed', e); }
  return defaultState();
}
function save(){
  idbSet(IDB_KEY, state).catch(e=>{ console.error('save failed', e); toast('保存に失敗しました。空き容量をご確認ください'); });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type='sine'; o.frequency.value=880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime+.35);
    o.start(); o.stop(ctx.currentTime+.35);
  }catch(e){}
}

/* ---------- Modal ---------- */
function openModal(html){
  document.getElementById('modal').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', (e)=>{ if(e.target.id==='overlay') closeModal(); });

/* ---------- Helpers: staff / lookups ---------- */
const activeStaff = ()=> state.staff.filter(s=>s.active!==false);
const activeCast = ()=> activeStaff().filter(s=>s.role==='cast');
const staffById = (id)=> state.staff.find(s=>s.id===id);
const rankById = (id)=> state.nominationRanks.find(r=>r.id===id);
const productById = (id)=> state.products.find(p=>p.id===id);
const planById = (id)=> state.setPlans.find(p=>p.id===id);
const tableById = (id)=> state.tables.find(t=>t.id===id);

function openSessionForTable(tableId){
  return state.sessions.find(s=>s.tableId===tableId && s.status==='open');
}
function sessionTotal(s){
  const items = (s.items||[]).reduce((sum,it)=> sum + it.unitPrice*it.qty, 0);
  return Math.max(0, items - (s.discount||0));
}
function findSetPrice(planId, guestCount, castCount){
  const plan = planById(planId);
  if(!plan) return null;
  const row = plan.rows.find(r=> guestCount>=r.minGuests && guestCount<=r.maxGuests && castCount>=r.minCast && castCount<=r.maxCast);
  return row ? row.price : null;
}
function findExtensionPrice(planId, guestCount, castCount){
  const plan = planById(planId);
  if(!plan) return null;
  const row = plan.rows.find(r=> guestCount>=r.minGuests && guestCount<=r.maxGuests && castCount>=r.minCast && castCount<=r.maxCast);
  if(row && row.extPrice!=null) return row.extPrice;
  return plan.extensionPrice;
}

/* ---------- Nav ---------- */
const TABS = [
  {id:'floor', ic:'◆', label:'フロア'},
  {id:'menu', ic:'☰', label:'メニュー'},
  {id:'staff', ic:'★', label:'スタッフ'},
  {id:'payroll', ic:'¥', label:'給与'},
  {id:'daily', ic:'▤', label:'収支'},
  {id:'settings', ic:'⚙', label:'設定'}
];
function renderNav(){
  document.getElementById('nav').innerHTML = TABS.map(t=>
    `<button data-action="tab" data-tab="${t.id}" class="${ui.tab===t.id && !ui.sessionId?'active':''}">
      <span class="ic">${t.ic}</span><span>${t.label}</span>
    </button>`).join('');
}

/* ---------- Clock / alert loop ---------- */
function tick(){
  const now = new Date();
  document.getElementById('clockDisp').textContent = now.toLocaleTimeString('ja-JP',{hour12:false});
  updateAlertBar(now);
  if(ui.tab==='floor' && !ui.sessionId) renderFloor();
  if(ui.sessionId){
    const s = state.sessions.find(x=>x.id===ui.sessionId);
    if(s && s.status==='open') renderSessionTimerOnly(s);
  }
}
function updateAlertBar(now){
  const bar = document.getElementById('alertbar');
  const open = state.sessions.filter(s=>s.status==='open');
  let changed=false;
  const chips=[];
  open.forEach(s=>{
    const remain = s.setEndTime - now.getTime();
    const tb = tableById(s.tableId);
    s._alert = s._alert || {};
    if(remain<=0){
      chips.push(`<span class="chip">⏰ ${tb?tb.name:'?'}卓：時間経過 ${Math.floor(-remain/60000)}分超過</span>`);
      if(!s._alert.over){ s._alert.over=true; beep(); changed=true; }
    } else if(remain<=10*60*1000){
      chips.push(`<span class="chip warn">⏳ ${tb?tb.name:'?'}卓：残り${Math.ceil(remain/60000)}分</span>`);
      if(!s._alert.warn){ s._alert.warn=true; beep(); changed=true; }
    }
  });
  bar.innerHTML = chips.join('');
  bar.classList.toggle('show', chips.length>0);
}

/* ---------- FLOOR ---------- */
function renderFloor(){
  const now=Date.now();
  const cards = state.tables.map(tb=>{
    const s = openSessionForTable(tb.id);
    if(!s){
      return `<button class="tablecard empty" data-action="openTable" data-id="${tb.id}">
        <div class="tname">${esc(tb.name)}</div>
        <div class="tstatus">空席</div>
        <div class="tmeta">定員${tb.capacity}名</div>
      </button>`;
    }
    const remain = s.setEndTime-now;
    let cls='active', statusTxt=`使用中・残り${fmtMin(remain)}`;
    if(remain<=0){ cls='over'; statusTxt=`時間経過 +${fmtMin(-remain)}`; }
    else if(remain<=10*60*1000){ cls='warn'; statusTxt=`まもなく終了 残り${fmtMin(remain)}`; }
    const castNames = s.castIds.map(id=>{const c=staffById(id);return c?c.name:'';}).filter(Boolean).join('・');
    return `<button class="tablecard ${cls}" data-action="openSession" data-id="${s.id}">
      <div class="tname">${esc(tb.name)} <span class="badge gold">${s.guestCount}名</span></div>
      <div class="tstatus">${statusTxt}</div>
      <div class="tmeta">${esc(castNames||'担当未設定')}</div>
      <div class="ttime mono">${yen(sessionTotal(s))}</div>
    </button>`;
  }).join('');
  document.getElementById('app').innerHTML = `
    <h2 class="viewtitle">フロア状況 <span class="sub">${state.tables.length}卓</span></h2>
    <div class="grid">${cards}</div>
  `;
}
function fmtMin(ms){
  const m = Math.floor(Math.abs(ms)/60000);
  const h = Math.floor(m/60); const mm = m%60;
  return h>0 ? `${h}時間${mm}分` : `${mm}分`;
}

function renderSessionTimerOnly(s){
  const el = document.getElementById('timerText');
  if(!el) return;
  const box = document.getElementById('timerBox');
  if(s.status==='open'){
    const remain = s.setEndTime - Date.now();
    el.textContent = (remain<0?'-':'') + fmtClock(Math.abs(remain));
    box.style.borderColor = remain<=0? 'var(--red)' : (remain<=10*60000? 'var(--amber)':'var(--bd)');
    el.style.color = remain<=0? 'var(--red)' : (remain<=10*60000? 'var(--amber)':'var(--ink)');
  } else {
    el.textContent = fmtClock(s.closeTime - s.openTime);
  }
}
function fmtClock(ms){
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), sec=totalSec%60;
  return h>0? `${h}:${pad2(m)}:${pad2(sec)}` : `${pad2(m)}:${pad2(sec)}`;
}

function confirmMergeTable(fromId, intoId){
  const from = state.sessions.find(x=>x.id===fromId);
  const into = state.sessions.find(x=>x.id===intoId);
  if(!from || !into) return;
  const fromTable = tableById(from.tableId);
  from.items.forEach(it=>{
    into.items.push(Object.assign({}, it, {id:uid('it'), name:`[${fromTable.name}卓より] ${it.name}`}));
  });
  into.guestCount += from.guestCount;
  from.castIds.forEach(id=>{ if(!into.castIds.includes(id)) into.castIds.push(id); });
  from.status = 'merged';
  from.mergedInto = into.id;
  from.mergedAt = Date.now();
  save(); closeModal(); renderSession(into.id);
  toast(`${fromTable.name}卓を合算しました`);
}

function confirmAddItem(sid, type){
  const s = state.sessions.find(x=>x.id===sid);
  let item;
  if(type==='set'){
    const g = parseInt(document.getElementById('mGuest').value)||1;
    const castIds = [...document.querySelectorAll('#mCastSel .chip.on')].map(c=>c.dataset.id);
    const planId = document.getElementById('mPlan').value;
    const plan = planById(planId);
    const price = parseInt(document.getElementById('mPrice').value)||0;
    const addToGuestCount = document.getElementById('mAddToGuestCount').classList.contains('on');
    item = {id:uid('it'), type:'set', name:`セット料金(${plan?plan.name:''})`, unitPrice:price, qty:1, attributedCastId:null, createdAt:Date.now()};
    if(addToGuestCount){
      s.guestCount += g;
      castIds.forEach(id=>{ if(!s.castIds.includes(id)) s.castIds.push(id); });
    }
  } else if(type==='nomination'){
    const castId = document.getElementById('mCast').value;
    const amt = parseInt(document.getElementById('mAmt').value)||0;
    if(!castId){ toast('キャストを選択してください'); return; }
    item = {id:uid('it'), type:'nomination', name:'指名料 ('+staffById(castId).name+')', unitPrice:amt, qty:1, attributedCastId:castId, createdAt:Date.now()};
  } else if(type==='drink'){
    const castId = document.getElementById('mCast').value;
    const prodSel = document.getElementById('mProd');
    const prod = productById(prodSel.value);
    const qty = parseInt(document.getElementById('mQty').value)||1;
    if(!castId||!prod){ toast('キャストと商品を選択してください'); return; }
    item = {id:uid('it'), type:'drink', name:prod.name+'（'+staffById(castId).name+'）', unitPrice:prod.price, qty, attributedCastId:castId, createdAt:Date.now()};
  } else if(type==='bottle'){
    const prod = productById(document.getElementById('mProd').value);
    const qty = parseInt(document.getElementById('mQty').value)||1;
    const castId = document.getElementById('mCast').value || null;
    if(!prod){ toast('商品を選択してください'); return; }
    item = {id:uid('it'), type:'bottle', name:prod.name+(castId?'（'+staffById(castId).name+'）':''), unitPrice:prod.price, qty, attributedCastId:castId, createdAt:Date.now()};
  } else if(type==='free'){
    const name = document.getElementById('mName').value.trim()||'その他';
    const amt = parseInt(document.getElementById('mAmt').value)||0;
    const qty = parseInt(document.getElementById('mQty').value)||1;
    item = {id:uid('it'), type:'other', name, unitPrice:amt, qty, attributedCastId:null, createdAt:Date.now()};
  }
  s.items.push(item); save(); closeModal(); renderSession(sid);
}

/* ---------- PAYROLL ---------- */
function shiftHours(sh){
  const [ih,im] = sh.clockIn.split(':').map(Number);
  const [oh,om] = sh.clockOut.split(':').map(Number);
  let start = ih*60+im, end = oh*60+om;
  if(end<=start) end += 24*60;
  return (end-start)/60;
}
function computePayroll(staffId, startDate, endDate){
  const s = staffById(staffId);
  const shifts = state.shifts.filter(x=>x.staffId===staffId && x.date>=startDate && x.date<=endDate);
  const hours = shifts.reduce((sum,x)=>sum+shiftHours(x),0);
  const wage = hours * s.hourlyWage;
  const transport = shifts.reduce((sum,x)=>sum+(x.transportFee||0),0);
  const closedSessions = state.sessions.filter(x=>x.status==='closed' && x.closeTime && dateStr(x.closeTime)>=startDate && dateStr(x.closeTime)<=endDate);
  let backTotal=0, backCount=0;
  closedSessions.forEach(sess=>{
    (sess.items||[]).forEach(it=>{
      if(it.attributedCastId===staffId){
        backCount += it.qty;
        backTotal += s.backType==='percent' ? it.unitPrice*it.qty*s.backValue/100 : s.backValue*it.qty;
      }
    });
  });
  return {hours, wage, transport, backTotal, backCount, net: wage+backTotal-transport};
}
function dateStr(ts){ const d=new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

function findPayout(staffId, start, end){
  return state.payouts.find(p=>p.staffId===staffId && p.periodStart===start && p.periodEnd===end);
}

/* ---------- CAST RANKING ---------- */
function computeCastStats(staffId, start, end){
  const closedSessions = state.sessions.filter(x=>x.status==='closed' && x.closeTime && dateStr(x.closeTime)>=start && dateStr(x.closeTime)<=end);
  let sales=0, nominationCount=0, drinkCount=0, tableCount=0;
  closedSessions.forEach(sess=>{
    if((sess.castIds||[]).includes(staffId)) tableCount++;
    (sess.items||[]).forEach(it=>{
      if(it.attributedCastId===staffId){
        sales += it.unitPrice*it.qty;
        if(it.type==='nomination') nominationCount += it.qty;
        if(it.type==='drink') drinkCount += it.qty;
      }
    });
  });
  const nominationRate = tableCount>0 ? (nominationCount/tableCount*100) : 0;
  return {sales, nominationCount, drinkCount, tableCount, nominationRate};
}

function typeLabel(t){ return {set:'セット料金',extension:'延長料金',nomination:'指名料',drink:'ドリンク',bottle:'ボトル/商品',other:'その他'}[t]||t; }
function computeSummary(start, end){
  const sessions = state.sessions.filter(s=>s.status==='closed' && s.closeTime && dateStr(s.closeTime)>=start && dateStr(s.closeTime)<=end);
  const byType = {}; let cash=0, card=0; const byTableCast = {};
  sessions.forEach(s=>{
    if(s.paymentMethod==='card') card += sessionTotal(s); else cash += sessionTotal(s);
    (s.items||[]).forEach(it=>{
      const key = typeLabel(it.type);
      byType[key] = (byType[key]||0) + it.unitPrice*it.qty;
      const tb = tableById(s.tableId);
      const label = (tb?tb.name:'?') + (it.attributedCastId? '／'+ (staffById(it.attributedCastId)?.name||'') : '');
      byTableCast[label] = (byTableCast[label]||0) + it.unitPrice*it.qty;
    });
  });
  const transportExpense = state.shifts.filter(x=>x.date>=start && x.date<=end).reduce((sum,x)=>sum+(x.transportFee||0),0);
  const expenses = state.expenses.filter(e=>e.date>=start && e.date<=end).sort((a,b)=>b.date.localeCompare(a.date));
  const purchaseExpense = expenses.reduce((sum,e)=>sum+(e.amount||0),0);
  const totalSales = cash+card;
  const totalExpense = transportExpense + purchaseExpense;
  return {sessions, byType, byTableCast, cash, card, totalSales, transportExpense, expenses, purchaseExpense, totalExpense, profit: totalSales - totalExpense};
}

  const a = document.createElement('a');
  const now = new Date();
  a.href = url;
  a.download = `club-stella-backup-${now.getFullYear()}${pad2(now.getMonth()+1)}${pad2(now.getDate())}-${pad2(now.getHours())}${pad2(now.getMinutes())}.json`;
  document.body.appendChild(a); a.click(); a.remove();

function handleImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!confirm('現在のデータを上書きして復元します。よろしいですか？')) return;
      state = parsed; save(); applyHeader(); renderCurrentTab();
      toast('復元しました');
    }catch(err){ toast('ファイルの読み込みに失敗しました'); }
  };
  reader.readAsText(file);
}
function resetAll(){
  if(!confirm('本当に全データを削除しますか？この操作は取り消せません。')) return;
  if(!confirm('最終確認：全ての会計・給与・設定データが消えます。よろしいですか？')) return;
  state = defaultState(); save(); applyHeader(); renderCurrentTab();
  toast('初期化しました');
}
function sessionArchiveDate(s){
  if(s.status==='closed') return dateStr(s.closeTime);
  if(s.status==='cancelled') return dateStr(s.cancelledAt||s.openTime);
  if(s.status==='merged') return dateStr(s.mergedAt||s.openTime);
  return null; // open sessions are never purged
}
function countPurgeTargets(cutoff){
  return {
    sessions: state.sessions.filter(s=>{ const d=sessionArchiveDate(s); return d!=null && d<cutoff; }).length,
    shifts: state.shifts.filter(x=>x.date<cutoff).length,
    payouts: state.payouts.filter(x=>x.periodEnd<cutoff).length,
    expenses: state.expenses.filter(x=>x.date<cutoff).length
  };
}
function archiveAndPurgeFn(){
  const cutoff = document.getElementById('purgeBefore').value;
  if(!cutoff){ toast('日付を選択してください'); return; }
  const c = countPurgeTargets(cutoff);
  const totalCount = c.sessions + c.shifts + c.payouts + c.expenses;
  if(totalCount===0){ toast('この日より前の削除対象データはありません'); return; }
  const msg = `${cutoff} より前のデータを削除します。\n会計履歴 ${c.sessions}件／勤怠 ${c.shifts}件／支給記録 ${c.payouts}件／買い出し記録 ${c.expenses}件\n\n先にバックアップファイルをダウンロードしてから削除します。よろしいですか？`;
  if(!confirm(msg)) return;
  exportData();
  state.sessions = state.sessions.filter(s=>{ const d=sessionArchiveDate(s); return !(d!=null && d<cutoff); });
  state.shifts = state.shifts.filter(x=>!(x.date<cutoff));
  state.payouts = state.payouts.filter(x=>!(x.periodEnd<cutoff));
  state.expenses = state.expenses.filter(x=>!(x.date<cutoff));
  save(); renderSettings();
  toast(`${totalCount}件の古いデータを削除しました`);
}

/* ---------- misc ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s); }
function applyHeader(){
  document.getElementById('storeNameHdr').innerHTML = esc(state.settings.storeName)+'<small>'+esc(state.settings.storeSub)+'</small>';
}

function renderCurrentTab(){
  renderNav();
  if(ui.sessionId){ renderSession(ui.sessionId); return; }
  ({floor:renderFloor, menu:renderMenu, staff:renderStaff, payroll:renderPayroll, daily:renderDaily, settings:renderSettings}[ui.tab]||renderFloor)();
}

/* ---------- Event delegation ---------- */
const ACTIONS = {
  tab:(el)=>{ ui.tab = el.dataset.tab; ui.sessionId=null; if(el.dataset.tab==='payroll') ui.payrollRevealed = {}; renderCurrentTab(); },
  backToFloor:()=>{ ui.sessionId=null; ui.tab='floor'; renderCurrentTab(); },
  openTable:(el)=> openTableModal(el.dataset.id),
  confirmOpenTable:(el)=> confirmOpenTable(el.dataset.tableid),
  openSession:(el)=>{ ui.sessionId = el.dataset.id; renderCurrentTab(); },
  closeModal:()=> closeModal(),
  extendSessionModal:(el)=> extendSessionModal(el.dataset.sid),
  confirmExtendSession:(el)=> confirmExtendSession(el.dataset.sid),
  editGuests:(el)=> editGuestsModal(el.dataset.sid),
  confirmEditGuests:(el)=> confirmEditGuests(el.dataset.sid),
  mergeTableModal:(el)=> mergeTableModal(el.dataset.sid),
  confirmMergeTable:(el)=> confirmMergeTable(el.dataset.fromid, el.dataset.intoid),
  addItem:(el)=> addItemModal(el.dataset.sid, el.dataset.type),
  confirmAddItem:(el)=> confirmAddItem(el.dataset.sid, el.dataset.type),
  removeItem:(el)=> removeItem(el.dataset.sid, el.dataset.iid),
  cancelSession:(el)=> cancelSession(el.dataset.sid),
  closeSessionModal:(el)=> closeSessionModalFn(el.dataset.sid),
  confirmCloseSession:(el)=> confirmCloseSession(el.dataset.sid),
  editPlan:(el)=> editPlanModal(el.dataset.id||null),
  addPlanRow:()=> addPlanRow(),
  removePlanRow:(el)=> removePlanRow(parseInt(el.dataset.idx)),
  savePlan:(el)=> savePlan(el.dataset.id),
  deletePlan:(el)=> deletePlan(el.dataset.id),
  editProduct:(el)=> editProductModal(el.dataset.id||null),
  toggleBack:(el)=> el.classList.toggle('on'),
  saveProduct:(el)=> saveProduct(el.dataset.id, el.dataset.existing),
  deleteProduct:(el)=> deleteProduct(el.dataset.id),
  editRank:(el)=> editRankModal(el.dataset.id||null),
  saveRank:(el)=> saveRank(el.dataset.id, el.dataset.existing),
  deleteRank:(el)=> deleteRank(el.dataset.id),
  editStaff:(el)=> editStaffModal(el.dataset.id||null),
  toggleActive:(el)=> el.classList.toggle('on'),
  saveStaff:(el)=> saveStaff(el.dataset.id, el.dataset.existing),
  shiftModal:(el)=> shiftModalFn(el.dataset.id),
  saveShift:(el)=> saveShift(el.dataset.staffid),
  deleteShift:(el)=> deleteShift(el.dataset.id, el.dataset.staffid),
  applyPayrollRange:()=> applyPayrollRange(),
  payrollView:(el)=> setPayrollView(el.dataset.view),
  togglePayrollReveal:(el)=> togglePayrollReveal(el.dataset.staffid),
  payoutModal:(el)=> payoutModalFn(el.dataset.staffid, el.dataset.start, el.dataset.end, el.dataset.amount),
  confirmPayout:(el)=> confirmPayoutFn(el.dataset.staffid, el.dataset.start, el.dataset.end, el.dataset.amount),
  cancelPayout:(el)=> cancelPayoutFn(el.dataset.id),
  applyRankRange:()=> applyRankRange(),
  applyDailyDate:()=> applyDailyDate(),
  summaryView:(el)=> setSummaryView(el.dataset.view),
  applySummaryRange:()=> applySummaryRange(),
  expenseModal:(el)=> expenseModalFn(el.dataset.date),
  confirmAddExpense:()=> confirmAddExpenseFn(),
  deleteExpense:(el)=> deleteExpenseFn(el.dataset.id),
  deleteExpenseInModal:(el)=> deleteExpenseInModalFn(el.dataset.id, el.dataset.date),
  closeModalAndRefreshDaily:()=> closeModalAndRefreshDaily(),
  saveSettings:()=> saveSettingsFn(),
  editTable:(el)=> editTableModal(el.dataset.id||null),
  saveTable:(el)=> saveTable(el.dataset.id, el.dataset.existing),
  deleteTable:(el)=> deleteTable(el.dataset.id),
  exportData:()=> exportData(),
  resetAll:()=> resetAll(),
  archiveAndPurge:()=> archiveAndPurgeFn()
};
document.addEventListener('click',(e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const fn = ACTIONS[el.dataset.action];
  if(fn) fn(el, e);
});

/* ---------- init ---------- */
(async function init(){
  if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
  state = await loadInitial();
  applyHeader();
  renderCurrentTab();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
